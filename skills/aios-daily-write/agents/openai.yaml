interface:
  display_name: "AIOS Daily Write"
  short_description: "生成和优化施工日报、项目日报和周报素材"
  default_prompt: "当任务涉及根据现场口述、项目群记录、照片说明、班组汇报或用户初稿生成施工日报、项目日报或周报素材时，使用该技能；默认以 Markdown 作为工作母版，必须包含资料来源、写作 brief、事实抽取、日报草稿、待补资料、人工复核岗位和审核门禁；不得编造当日完成量、人员、机械、材料、质量安全、天气、照片编号、责任人或明日计划；生成后必须交回 aios-construction-daily 复核；已使用 aios-construction-daily 的团队可继续作为同类复核入口。"
