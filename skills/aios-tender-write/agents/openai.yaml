interface:
  display_name: "AIOS Tender Write"
  short_description: "生成和优化工程技术标、评分点响应和标书章节"
  default_prompt: "当任务涉及工程标书、技术标、投标响应章节的生成、改写或历史素材复用时，使用该技能；没有成熟 Word 母版时默认以 Markdown 作为工作母版；用户提供历史技术标 docx 母版并要求保留页眉页脚、表格、图片、字体、标题层级、编号和版式时，进入 docx-preserve-rewrite，并优先识别盘点母版、建立响应矩阵、整理替换清单、生成第 X 章修改单、写入 Word、扫描残留、生成候选版这 7 个中文业务动作；必须包含资料来源、待补资料、人工复核岗位和审核门禁；不得编造资质、业绩、人员、设备、工期、金额或中标结论；生成后必须交回 aios-tender-audit 复核；已使用 aios-commercial-tender 的团队可继续作为同类审核入口。"
