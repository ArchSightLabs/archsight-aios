interface:
  display_name: "AIOS Meeting Write"
  short_description: "生成和优化工程会议纪要、待办清单和下次追踪"
  default_prompt: "当任务涉及根据录音转写、会议笔记、群聊摘要、手写记录或用户初稿生成工程会议纪要、待办清单或下次追踪事项时，使用该技能；默认以 Markdown 作为工作母版，必须包含资料来源、写作 brief、结论和待办抽取、纪要草稿、待补资料、人工复核岗位和审核门禁；不得编造会议日期、参会方、发言人、责任人、期限、交付物、附件、签发状态或会议结论；生成后必须交回 aios-construction-meeting 复核；已使用 aios-construction-meeting 的团队可继续作为同类复核入口。"
